<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just One Question 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffafbd, #ffc3a0);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 15px 30px rgba(0,0,0,0.2);
  max-width: 380px;
  z-index: 2;
  animation: pop 0.8s ease;
}

@keyframes pop {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

h1, h2 {
  color: #ff4d6d;
}

p {
  color: #555;
}

button {
  margin: 15px;
  padding: 12px 25px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

.yes {
  background: #ff4d6d;
  color: white;
}

.no {
  background: #eee;
  color: #aaa;
  cursor: not-allowed;
}

#response {
  display: none;
  margin-top: 15px;
  color: #ff4d6d;
  font-size: 18px;
}

video {
  display: none;
  margin-top: 20px;
  width: 100%;
  border-radius: 15px;
}

/* ❤️ Confetti hearts */
.heart {
  position: fixed;
  font-size: 24px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  from { transform: translateY(-10vh); opacity: 1; }
  to { transform: translateY(110vh); opacity: 0; }
}

/* 💖 Final message */
#finalMessage {
  display: none;
  margin-top: 20px;
}

.happy {
  font-size: 26px;
  color: #ff1e4d;
  animation: glow 2s infinite;
}

.boo {
  font-size: 22px;
  color: #ff4d6d;
  animation: bounce 1.5s infinite;
}

@keyframes glow {
  0% { text-shadow: 0 0 5px #ff4d6d; }
  50% { text-shadow: 0 0 20px #ff1e4d; }
  100% { text-shadow: 0 0 5px #ff4d6d; }
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
</style>
</head>

<body>

<div class="card">
  <h1>Hey You 💕</h1>
  <p>
    I was thinking for a while…<br>
    and my heart said I should ask you this 🥺
  </p>

  <h2>Will you be my Valentine? 💝</h2>

  <button class="yes" onclick="yesClicked()">Yes ❤️</button>
  <button class="no" disabled>No 🙈</button>

  <div id="response">You just made my heart so happy 🥹💖</div>

  <video id="ourVideo">
    <source src="us.mp4" type="video/mp4">
  </video>

  <div id="finalMessage">
    <div class="happy">Happy Valentine’s Day 💘</div>
    <div class="boo">My Boo ❤️</div>
  </div>
</div>

<audio id="bgMusic" src="music.mp3" loop></audio>

<script>
function yesClicked() {
  document.getElementById("response").style.display = "block";

  const vid = document.getElementById("ourVideo");
  vid.style.display = "block";
  vid.play();

  // Confetti
  for (let i = 0; i < 40; i++) {
    createHeart();
  }

  // After video ends
  vid.onended = () => {
    document.getElementById("finalMessage").style.display = "block";
    document.getElementById("bgMusic").play();
  };
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (2 + Math.random() * 2) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 3000);
}
</script>

</body>
</html>
